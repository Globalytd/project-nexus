name: Bug Report
description: Report a bug in Project Nexus
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thank you for reporting a bug."
  - type: input
    id: screen
    attributes:
      label: Affected screen or component
      placeholder: e.g. LoginScreen, HomeScreen
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: Describe the bug
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Navigate to ...
        3. Tap ...
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: e.g. Pixel 7, Android 14
